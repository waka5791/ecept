<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カルドエセプト</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%23d97706'/%3E%3Cpath d='M8 34V16h5v-5h4v5h6v-5h4v5h5v18z' fill='%23fde68a' stroke='%2378350f' stroke-width='1.5'/%3E%3Cpath d='M17 34v-8a3 3 0 0 1 6 0v8' fill='%2378350f'/%3E%3C/svg%3E">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 color-scheme:light;--bg:#f5f3ee;--fg:#1c1b19;--mut:#6b675f;--card:#fffdf8;--line:#d9d4c8;--acc:#2f5fd0;--accfg:#fff;--warn:#b45309}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171614;--fg:#ece8df;--mut:#a29d92;--card:#232220;--line:#3b3935;--acc:#7da2ff;--accfg:#0e1a3a;--warn:#f0b35a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171614;--fg:#ece8df;--mut:#a29d92;--card:#232220;--line:#3b3935;--acc:#7da2ff;--accfg:#0e1a3a;--warn:#f0b35a}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:1560px;margin:0 auto;padding:8px 12px;height:100vh;height:100dvh;min-height:700px;display:flex;flex-direction:column} /* 画面の高さに収める(小さい画面では min-height を超えた分だけ縦スクロール) */
header{position:relative;z-index:2147480000;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:6px}
h1{font-size:18px;margin:0}#status{color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline}#status b{color:var(--fg)}#status .sep{opacity:.5}#status .battle{color:var(--fg);background:color-mix(in srgb,#ef4444 14%,var(--card));border-radius:6px;padding:0 6px}
.main{display:grid;grid-template-columns:minmax(0,1fr);flex:1 1 auto;min-height:0;position:relative}
.main aside{position:absolute;inset:0;z-index:5;pointer-events:none}.main aside .panel{pointer-events:auto;position:absolute;width:300px;box-sizing:border-box;margin:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}.main aside #players{top:8px;left:8px;width:auto;max-width:calc(100% - 310px);background:none;border:0;padding:0;box-shadow:none;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
.ppan{pointer-events:auto;padding:2px;border-radius:0 0 8px 0;background:linear-gradient(160deg,color-mix(in srgb,var(--pc) 70%,#000),color-mix(in srgb,var(--pc) 40%,#000));box-shadow:0 3px 10px rgba(0,0,0,.28);font-size:12px;line-height:1.35}
.ppan .ppin{border-radius:0 0 6px 0;overflow:hidden}
.ppan .pr1{display:flex;align-items:center;gap:5px;padding:2px 7px;background:color-mix(in srgb,var(--pc) 22%,#fff);color:#111;font-weight:800;white-space:nowrap}
.ppan .pturn{margin-left:auto;display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:700}
.ppan .pr2,.ppan .pr3{padding:1px 7px;background:color-mix(in srgb,var(--pc) 28%,#0b0f19);color:#f1f5f9;white-space:nowrap;text-align:right}.ppan .pr3{display:flex;align-items:center;gap:8px;padding-bottom:3px}.ppan .pr3 .prr{margin-left:auto}
.ppan .pord{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:2px solid;font-size:11px;font-weight:900;flex:none}
.ppan .pmk{color:#b45309;font-weight:900;cursor:help}.ppan .mag-neg{color:#fca5a5}
.ppan.self{min-width:242px;font-size:14px}.ppan:not(.self){min-width:106px;font-size:12px}.ppan .gu{margin-left:.22em;font-size:.82em}
.ppan.cur{box-shadow:0 0 0 2px #fff,0 0 12px 3px var(--pc)}
.ppan .fms .fm{color:#cbd5e1;border:1px solid rgba(203,213,225,.55);background:none;opacity:1}.ppan .fms .fm.on{color:#1f1300;border-color:#fde68a;background:#fde68a}#logpanel{position:fixed;width:300px;height:320px;display:flex;flex-direction:column;padding:0;overflow:hidden;border-radius:10px;z-index:5;margin:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}#logpanel .lgbar{display:flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;background:linear-gradient(180deg,#64748b,#334155 60%,#1e293b);color:#fff;cursor:move;user-select:none;touch-action:none;flex:0 0 auto}#logpanel .lgt{flex:1;font-weight:800;font-size:12.5px}#logpanel .lgbar button{padding:0 7px;font-size:12px;line-height:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:5px}#logpanel #log{padding:6px 10px}#logpanel.collapsed{height:auto!important}#logpanel.collapsed #log{display:none} /* 順位(左上)とログ(右端・全高)はマップの上に重ねる */
.main #boardwrap{order:0}@media (max-width:820px){.main aside{position:static;pointer-events:auto}.main aside .panel{position:static;width:auto;margin-bottom:10px}.wrap{height:auto}#board svg{height:auto}}
#board{display:flex;flex-direction:column;height:100%}
#board svg{display:block;width:100%;height:100%;min-height:300px;font-family:inherit} /* 盤面は残りの高さに合わせて縮む */
#center{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
#center b{font-size:15px}.mut{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.pl{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:13px}.pl.cur{font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
#log{flex:1 1 auto;min-height:0;height:0;overflow:auto;font-size:14.4px;line-height:1.5}#log div{border-bottom:1px solid var(--line);padding:1px 0}
#handbox{position:absolute;left:12px;right:12px;bottom:8px;margin:0;padding:0;background:none;border:0;box-shadow:none;pointer-events:none;z-index:6} /* 手札はマップの上に重ねる(枠なし) */
#resinfo{display:none!important}#handbox #cards{pointer-events:none}#handbox #cards .card,#handbox #cards>*{pointer-events:auto}
.wrap{position:relative}
.handtop{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;min-height:30px}.handtop #actions{min-height:0;display:flex;flex-wrap:wrap;gap:6px}

#cards{display:flex;gap:8px;overflow-x:auto;padding:12px 6px 4px}
.card{flex:none;width:156px;background:var(--card);border:5px solid var(--line);border-radius:10px;padding:3px 6px;position:relative;cursor:pointer;font-size:12px}
/* ---- マップ内の操作ボタン(リッチ): 主ボタンは紺→青のグラデーション、ほかは落ち着いた色 */
#dicelayer #actions button{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),color-mix(in srgb,var(--card) 88%,#000));border:1px solid color-mix(in srgb,var(--line) 70%,#000);border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 0 color-mix(in srgb,var(--line) 60%,#000),0 3px 8px rgba(0,0,0,.18);transition:transform .08s,box-shadow .12s;font-weight:700}
#dicelayer #actions button:hover:not(:disabled){transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 color-mix(in srgb,var(--line) 60%,#000),0 6px 14px rgba(0,0,0,.22)}
#dicelayer #actions button:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.25),0 0 0 transparent}
#dicelayer #actions button.pri{color:#fff;border-color:#0b1f5c;background:linear-gradient(180deg,#5b8cff 0%,#2f5fd0 45%,#1e3a8a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 3px 0 #0b1f5c,0 6px 16px rgba(30,58,138,.45);text-shadow:0 1px 1px rgba(0,0,0,.35)}
#dicelayer #actions button.pri:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(0,0,0,.25),0 4px 0 #0b1f5c,0 8px 22px rgba(59,130,246,.6)}
#dicelayer #actions button.pri:active:not(:disabled){box-shadow:inset 0 3px 6px rgba(0,0,0,.4)}
#actions kbd{display:inline-block;margin-left:8px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:700;line-height:18px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 -1px 0 rgba(0,0,0,.25);vertical-align:middle}
#actions button:not(.pri) kbd{background:var(--card);border-color:var(--line);color:var(--mut)}
#actions .endbtn .bico{display:inline-block;margin-right:8px;width:22px;height:22px;line-height:22px;border-radius:50%;background:rgba(255,255,255,.22);font-size:13px;vertical-align:middle}
/* ダイス(八面体) */
#actions .richdice{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px 8px 10px;max-width:340px}
#actions .richdice .dice{display:flex;gap:4px}
#actions .richdice .dsub{flex-basis:100%}
svg.die{width:40px;height:48px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));transition:transform .15s}
#actions .richdice:hover svg.die{transform:rotate(-12deg) scale(1.06)}
svg.dicefx{position:fixed;z-index:60;pointer-events:none;transform-origin:50% 55%}
svg.dicefx.spin0{animation:dspin0 var(--sp,.8s) cubic-bezier(.2,.7,.3,1) both}
svg.dicefx.spin1{animation:dspin1 var(--sp,.9s) cubic-bezier(.2,.7,.3,1) both}
svg.dicefx.spin2{animation:dspin2 var(--sp,1s) cubic-bezier(.2,.7,.3,1) both}
@keyframes dspin0{0%{transform:translate(0,0) rotate(0) scale(1)}35%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 34px)) rotate(400deg) scale(var(--s1,4))}100%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 18px)) rotate(1080deg) scale(var(--s2,4.5))}}
@keyframes dspin1{0%{transform:translate(0,0) rotate(0) scale(1)}40%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 42px)) rotate(-340deg) scale(var(--s1,4))}100%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 18px)) rotate(-900deg) scale(var(--s2,4.5))}}
@keyframes dspin2{0%{transform:translate(0,0) rotate(0) scale(1)}45%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 30px)) rotate(300deg) scale(var(--s1,4))}100%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 18px)) rotate(1260deg) scale(var(--s2,4.5))}}
svg.dicefx.landed{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 18px)) scale(var(--s2,4.5));animation:dland .35s ease-out}
@keyframes dland{0%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 18px)) scale(calc(var(--s2,4.5) * 1.13))}60%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 14px)) scale(calc(var(--s2,4.5) * .95))}100%{transform:translate(var(--dx,0px),calc(var(--dy,0px) - 18px)) scale(var(--s2,4.5))}}
svg.dicefx.fade{transition:opacity .45s;opacity:0}
/* 領地コマンド */
.banner.landcmd{border:5px solid #3b82f6;background:rgba(10,25,60,.86)}.banner.landcmd .bs{font-size:clamp(24px,4.6vw,40px);font-weight:900;color:#dbeafe;letter-spacing:.08em}
.landpulse{fill:none;stroke-width:5;stroke-linejoin:round;animation:landpulse 1.4s ease-in-out infinite}@keyframes landpulse{0%,100%{opacity:.25}50%{opacity:1}}
/* スペルの対象選び(マップ中央) */
#pickdlg,#tpkdlg{display:none;overflow:auto;position:fixed;left:calc(var(--mx,0px) + var(--mw,100%) / 2);top:calc(var(--my,0px) + var(--mh,100%) / 2);transform:translate(-50%,-50%);z-index:80;min-width:300px;max-width:min(560px,92%);background:linear-gradient(180deg,color-mix(in srgb,var(--card) 96%,#fff),var(--card));border:2px solid #8b5cf6;border-radius:16px;padding:12px 14px;box-shadow:0 0 0 4px rgba(139,92,246,.18),0 18px 40px rgba(0,0,0,.35);animation:pop .25s ease-out}
#shopdlg{display:none;position:absolute;left:calc(var(--mx,0px) + var(--mw,100%) / 2);top:calc(var(--my,0px) + var(--mh,100%) / 2);transform:translate(-50%,-50%);z-index:9;background:var(--card);border:3px solid #0891b2;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#shopdlg .shh{font-weight:900;font-size:16px;color:#0e7490;margin-bottom:8px}#shopdlg .shrow{display:flex;gap:12px;align-items:flex-start}#shopdlg .shit{display:flex;flex-direction:column;align-items:center;gap:6px}#shopdlg .shit .card{zoom:1.1;cursor:pointer}#shopdlg .shit .card.dis{cursor:not-allowed}#shopdlg .shcost{font-weight:800}#shopdlg .shwhy{font-size:11px;color:var(--warn)}#shopdlg .shfoot{display:flex;justify-content:flex-end;margin-top:10px}
.banner.encounter .bs{font-size:clamp(26px,4vw,40px);font-weight:900;color:#b91c1c;letter-spacing:.12em}.banner.encounter{border-color:#b91c1c}
#pickdlg .pkhead,#tpkdlg .pkhead{font-weight:900;font-size:16px;margin-bottom:10px;color:#6d28d9}
#pickdlg .pkrows,#tpkdlg .pkrows{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
#pickdlg .pkrow,#tpkdlg .pkrow{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:12px;border:2px solid color-mix(in srgb,var(--pc) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 12%,var(--card)),var(--card));box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .1s,box-shadow .12s}
#pickdlg .pkrow:hover:not(.dis),#tpkdlg .pkrow:hover:not(.dis),#pickdlg .pkrow.hl:not(.dis),#tpkdlg .pkrow.hl:not(.dis){transform:translateY(-2px);border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 35%,transparent),0 8px 18px rgba(0,0,0,.2)}
#pickdlg .pkrow.dis,#tpkdlg .pkrow.dis{opacity:.5;cursor:not-allowed}
#pickdlg .pkinfo,#tpkdlg .pkinfo{display:flex;flex-direction:column;font-size:12px;line-height:1.45}#pickdlg .pkinfo b,#tpkdlg .pkinfo b{font-size:14px;color:var(--pc)}#pickdlg .pkimp,#tpkdlg .pkimp{color:var(--mut)}#pickdlg .pkwhy,#tpkdlg .pkwhy{color:var(--warn);font-weight:700}
#pickdlg .pkfoot,#tpkdlg .pkfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px}#pickdlg .pkfoot kbd,#tpkdlg .pkfoot kbd{font-size:11px;font-weight:700;padding:0 5px;border:1px solid var(--line);border-radius:4px}
#pickmenu{display:none;position:fixed;z-index:70;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.3)}#pickmenu .pmh{font-size:11px;font-weight:700;color:var(--mut)}#pickmenu button{display:flex;align-items:center;gap:6px;padding:4px 10px;font-weight:700}#pickmenu button.dis{opacity:.5}
.pickring{fill:none;stroke:#8b5cf6;stroke-width:2.4;animation:landpulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pkhl .pickring{stroke:#f59e0b;stroke-width:3.4;animation:none;transform:scale(1.3)}
.pkhl .avbody{filter:brightness(1.18) drop-shadow(0 0 3px #f59e0b)}.avng{opacity:.55}
/* 領地クリーチャースペルのウインドウ */
#lsw{display:none;position:fixed;z-index:4;width:280px;flex-direction:column;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 70%,#000);border-radius:0;box-shadow:none;overflow:hidden;font-size:13px}
#lsw .lswbar{display:flex;flex:0 0 auto;align-items:center;gap:4px;padding:4px 6px 4px 10px;background:linear-gradient(180deg,#5b8cff,#2f5fd0 55%,#1e3a8a);color:#fff;cursor:default;user-select:none;touch-action:none}
#lsw .lswt{flex:1;font-weight:800;font-size:12.5px;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.35)}
#lsw .lswbar button{padding:0 7px;font-size:12px;line-height:20px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:5px}#lsw .lswbar button:disabled{opacity:.35;cursor:default}
#lsw .lswbody{flex:1 1 auto;min-height:0;overflow:auto}#lsw.collapsed{height:auto!important}#lsw.collapsed .lswbody{display:none}
#lsw .lswp{padding:6px 10px;font-weight:800;border-bottom:1px solid var(--line)}
#lsw .lsrow{padding:5px 10px;border-bottom:1px dashed var(--line);cursor:default}#lsw .lsrow.can{cursor:pointer;font-weight:700}#lsw .lsrow.can:hover{background:color-mix(in srgb,var(--acc) 14%,var(--card))}#lsw .lsrow:not(.can){color:var(--mut)}#lsw .lsrow.empty{opacity:.55}#lsw .lsrow:hover{outline:2px solid #f59e0b;outline-offset:-2px}
/* 侵略時の効果の札 */
#invlayer .invfx{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.fxchip{display:block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:7px;border:1px solid;box-shadow:0 1px 4px rgba(0,0,0,.15);animation:pop .25s ease-out}
.fxchip.good{background:color-mix(in srgb,#22c55e 16%,var(--card));border-color:#16a34a;color:#15803d}
.fxchip.bad{background:color-mix(in srgb,#ef4444 14%,var(--card));border-color:#dc2626;color:#b91c1c}
.fxchip.nt{background:color-mix(in srgb,#64748b 12%,var(--card));border-color:#94a3b8;color:var(--fg)}
@media (prefers-reduced-motion:reduce){svg.dicefx{animation:none!important}.landpulse,.pickring{animation:none}}
/* 領地コマンドの枠 */
#landcmd{display:none;position:fixed;z-index:80;overflow:auto;min-width:250px;max-width:min(380px,70%);background:var(--card);border:2px solid #2f5fd0;border-radius:12px;padding:8px 10px;box-shadow:0 10px 26px rgba(0,0,0,.3);animation:pop .2s ease-out;font-size:12.5px}
#landcmd::before{content:"";position:absolute;left:-9px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:#2f5fd0;border-left:0}
#landcmd.lft::before{left:auto;right:-9px;border:8px solid transparent;border-left-color:#2f5fd0;border-right:0}
#landcmd .lch{font-weight:900;color:#1e3a8a;margin-bottom:6px;font-size:13px}
#landcmd .lcr{display:grid;grid-template-columns:7.5em 1fr;gap:6px;align-items:start;padding:4px 0;border-top:1px dashed var(--line)}
#landcmd .lck{font-weight:800;color:var(--mut);padding-top:4px}#landcmd .lcv{display:flex;flex-wrap:wrap;gap:4px}
#landcmd .lcb{padding:3px 9px;font-size:12px;font-weight:700;border-radius:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 92%,#fff),color-mix(in srgb,var(--card) 88%,#000));box-shadow:0 1px 0 color-mix(in srgb,var(--line) 60%,#000)}
#landcmd .lcb:hover:not(:disabled){border-color:#2f5fd0;box-shadow:0 0 0 2px rgba(47,95,208,.25)}#landcmd .lcb:disabled{opacity:.45;cursor:not-allowed}
#landcmd .lcb.mv{border-color:#16a34a;color:#15803d}#landcmd .lcb.mi{border-color:#dc2626;color:#b91c1c}
#landcmd .lcb .elico,.banner .elico{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
#landcmd .hint .lcv{color:var(--mut);padding-top:4px}
/* 着地点の情報 */
.banner.landinfo{border:4px solid #94a3b8;background:rgba(20,24,32,.84)}.banner.landinfo .lirow{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(20px,3.6vw,30px);font-weight:900}.banner.landinfo .elico{width:1.1em;height:1.1em}
.banner.landinfo .likind{color:#fde68a}.banner.landinfo .lilv{color:#cbd5e1;font-size:.75em}.banner.landinfo .liwho{font-size:clamp(16px,2.6vw,22px);font-weight:800;margin-top:2px;text-shadow:0 1px 2px #000}.banner.landinfo .lisub{font-size:14px;color:#e2e8f0;margin-top:2px}
/* 総資産の変動(リール) */
.banner.assets{border:4px solid #eab308;background:rgba(30,24,4,.86)}.asrow{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(18px,3vw,26px);font-weight:800;color:#fff;margin:2px 0}.asrow .aslbl{font-size:.65em;color:#fde68a}.asrow .asunit{font-size:.8em}

/* M86 デッキ編集・マップ編集を開いている間は、ヘッダを前面にしない(閉じるボタンが隠れないように) */
body:has(#editor[style*="block"]) header,body:has(#mapeditor[style*="block"]) header{z-index:1}

/* M87 周回ボーナスのパネル(ガラスのプレート、金の柱に城の模型) */
.lapbd .lbox{left:-190px;top:-120px;width:380px;display:flex;border-radius:14px;overflow:hidden;background:rgba(15,23,42,.92);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.18);animation:lbox calc(2700ms / var(--sp)) ease-out both}
.lapbd .lbar{width:64px;flex:0 0 64px;display:grid;place-items:center;background:linear-gradient(180deg,#fde68a,#b45309)}
.lapbd .lbar .shrmodel{position:static!important;transform:none!important;width:50px;height:62px}
.lapbd .lin{flex:1;padding:10px 14px 12px;min-width:0}
.lapbd .lh{font-weight:900;font-size:17px;color:#fde68a;display:flex;align-items:center;gap:6px}
.lapbd .lnm{border-radius:6px;padding:0 8px;font-size:14px}
.lapbd .lfs{display:flex;gap:4px;margin-top:6px}
.lapbd .lfm{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid;font-style:normal;font-size:11px;font-weight:900}
.lapbd .lrs{margin-top:8px;border-top:1px solid rgba(255,255,255,.12)}
.lapbd .lr{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.15);opacity:0;animation:lr calc(300ms / var(--sp)) ease-out calc(var(--d) * 380ms / var(--sp)) both}
.lapbd .lr span{color:#cbd5e1;font-weight:700}.lapbd .lr b{font-weight:900;font-variant-numeric:tabular-nums}.lapbd .lr i{font-style:normal}
.lapbd .lt{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px;opacity:0;animation:lr calc(300ms / var(--sp)) ease-out calc(var(--d) * 380ms / var(--sp)) both}
.lapbd .lt b{font-size:28px;font-weight:900;color:#fde68a;font-variant-numeric:tabular-nums}
.lapbd .lt small{background:#0369a1;color:#e0f2fe;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:800}

/* M87 結果表示の間: ヘッダのパーツとリプレイの操作欄を暗くして押せないように */
body:has(#overlay[style*="flex"] #box.endwin) header>*{filter:brightness(.45);pointer-events:none!important;user-select:none}
body:has(#overlay[style*="flex"] #box.endwin) header{pointer-events:none}

/* M87 領地クリーチャースペル: 3列(スペル|コスト|クリーチャー)・直角の外枠・黒基調のタイトルバー */
#lsw{border-radius:0!important;border:1px solid #0f172a!important;width:330px}
#lsw .lswbar{background:linear-gradient(180deg,#334155,#111827 60%,#030712)!important}
#lsw .lswbar button{border-radius:3px}
#lsw .lsrow{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1.25fr);column-gap:10px;align-items:center}
#lsw .lsrow.lshd{font-size:11px;color:#94a3b8;font-weight:700;padding-top:3px;padding-bottom:3px;border-bottom:1px solid var(--line);cursor:default;background:none!important}
#lsw .lsc{text-align:right;font-variant-numeric:tabular-nums}
#lsw .lsn,#lsw .lsk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lsw .lse{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#lsw .lsrow:not(.can) .lse{opacity:.5}
#lsw .lsk small{font-size:10.5px;color:var(--mut);margin-left:4px;font-weight:600}
#lsw .lsrow.can:hover,#lsw .lsrow.can.hl{background:#fef9c3!important;box-shadow:inset 3px 0 0 #eab308}
/* M87 ログ: タイトルバーは白、外枠は黒 */
#logpanel{border:2px solid #0f172a!important}
#logpanel .lgbar{background:#fff!important;color:#0f172a!important;border-bottom:1px solid #cbd5e1}
#logpanel .lgbar button{background:#f8fafc!important;border-color:#64748b!important;color:#0f172a!important}

/* M87 フェイズアクションボタン: 金属のフレーム(金=Space の主ボタン、銀=ほか)+白系統の文字盤 */
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn){--mf:linear-gradient(180deg,#ffffff,#e6eaf0);--mm:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.06) 1px 3px),linear-gradient(180deg,#ffffff 0%,#dfe4e9 20%,#7d8792 48%,#3d444c 52%,#8b949e 60%,#e6eaee 85%,#59616a 100%);--md:#1f2328;--mk:#3d444c;
  position:relative;border:5px solid transparent!important;border-radius:16px 4px 16px 4px!important;background:var(--mf) padding-box,var(--mm) border-box!important;color:var(--md)!important;font-weight:800!important;text-shadow:none!important;padding:6px 14px!important;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.9),0 0 0 1px var(--mk),0 3px 0 var(--mk),0 6px 12px rgba(0,0,0,.35)!important;transition:transform .08s,box-shadow .08s}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):is(.endbtn,.dwl:first-child){--mf:linear-gradient(180deg,#fffdf5,#efe7d2);--mm:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,rgba(0,0,0,.07) 1px 3px),linear-gradient(180deg,#fffbe0 0%,#f3cf5e 20%,#a87406 48%,#6b4702 52%,#b98208 60%,#f6d877 85%,#7a5204 100%);--md:#3a2400;--mk:#5a3a02;padding-left:18px!important;padding-right:18px!important}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):is(.endbtn,.dwl:first-child)::before,html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):is(.endbtn,.dwl:first-child)::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e0b040 45%,#4a3000)}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):is(.endbtn,.dwl:first-child)::before{left:-6px}html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):is(.endbtn,.dwl:first-child)::after{right:-6px}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 0 0 1px var(--mk),0 0 0 var(--mk),0 2px 4px rgba(0,0,0,.3)!important}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn):disabled{filter:grayscale(.6);opacity:.55}
html body #dicelayer #actions button:not(.diceobj):not(.fsbtn) kbd{background:var(--md)!important;color:#fff!important;border:0!important;box-shadow:none!important;margin-left:8px}
html body #dicelayer #actions button.endbtn{font-size:17px!important;padding-top:9px!important;padding-bottom:9px!important}
html body #dicelayer #actions button.toll:not(.diceobj):not(.fsbtn){color:#b91c1c!important}
#actions .dicewin{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;gap:7px!important}
#actions .actnote{align-self:center;font-size:12px;font-weight:700;color:var(--fg);background:color-mix(in srgb,var(--card) 85%,transparent);border-radius:6px;padding:2px 8px}
#actions .actnote .short{color:#dc2626}
/* M87 ターン終了の隣の案内札(銀のフレーム) */
#actions .lchint{align-self:center;border:5px solid transparent;border-radius:10px;background:linear-gradient(180deg,#ffffff,#e6eaf0) padding-box,repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.06) 1px 3px) border-box,linear-gradient(180deg,#ffffff 0%,#dfe4e9 20%,#7d8792 48%,#3d444c 52%,#8b949e 60%,#e6eaee 85%,#59616a 100%) border-box;box-shadow:inset 0 2px 3px rgba(0,0,0,.2),0 0 0 1px #3d444c,0 4px 10px rgba(0,0,0,.3);padding:6px 10px;color:#1f2328;max-width:460px}
#actions .lchint .lhh{display:flex;align-items:center;gap:8px}
#actions .lchint .lhi{width:24px;height:24px;border-radius:6px;background:#1e40af;color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 24px}
#actions .lchint b{display:block;font-size:13px}#actions .lchint small{display:block;font-size:11px;color:#475569}
#actions .lchint .lhc{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
#actions .lchint .lco{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:1px 9px;border-radius:9px;border:1px solid #cbd5e1;background:#f1f5f9;color:#94a3b8;cursor:default}
#actions .lchint .lco.on{border-color:#16a34a;background:#dcfce7;color:#14532d}
#actions .lchint .lco.on:hover{background:#bbf7d0;box-shadow:0 0 0 2px rgba(22,163,74,.35)}
#actions .lchint .lco svg{width:14px;height:14px}

/* M88 情報ウインドウ: 羊皮紙(1行目は見出し+区切り線、2行目からは小さめ) */
#sptip{background:#fdf6e3!important;color:#3b2a10!important;border:2px solid #8a6a2f!important;border-radius:4px!important;box-shadow:inset 0 0 0 3px #f5e6c4,0 6px 16px rgba(0,0,0,.3)!important;font-size:14px!important;padding:7px 12px!important}
#sptip>b:first-child{display:block;font-size:14.5px;color:#5a3a02;border-bottom:1px dashed #b89a5e;padding-bottom:3px;margin-bottom:3px}
#sptip>div{font-size:13px}
/* M88 刻印・波動: 明るいすりガラス(直角) */
#sptip.glass{background:rgba(255,255,255,.55)!important;color:#0f172a!important;border:0!important;border-radius:0!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 0 0 1px rgba(15,23,42,.25),0 6px 16px rgba(0,0,0,.2)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);width:300px;max-width:300px}
#sptip.glass .ghd{font-size:14px;font-weight:900;color:#1e293b;border-bottom:1px solid rgba(15,23,42,.2);padding-bottom:3px;margin-bottom:4px}
#sptip.glass .ghd small{font-size:11.5px;font-weight:600;color:#475569;margin-left:6px}
#sptip.glass .grow{display:grid;grid-template-columns:auto 1fr;column-gap:8px;padding:3px 0;align-items:start}
#sptip.glass .grow.off{opacity:.5}
#sptip.glass .gbd{font-size:12px;font-weight:800;border-radius:9px;padding:0 6px;white-space:nowrap;background:#fff;border:1px solid currentColor}
#sptip.glass .gt{font-size:13px;font-weight:800}#sptip.glass .gd{font-size:12px;color:#334155}
#sptip.glass .gtag{font-size:11px;border-radius:0;padding:0 5px;margin-left:4px;background:rgba(15,23,42,.1);font-weight:700}
#sptip.glass .gsum{margin-top:4px;padding-top:3px;border-top:1px solid rgba(15,23,42,.2);font-size:12.5px;font-weight:800}

/* M88 領地にマウスを乗せたときのウインドウ: 羊皮紙、左にカード・右に 土地/状態/スペル */
#tip.tpn{z-index:2147481000;max-width:none;display:none;background:#fdf6e3;color:#3b2a10;border:2px solid #8a6a2f;border-radius:4px;padding:10px;box-shadow:inset 0 0 0 3px #f5e6c4,0 6px 18px rgba(0,0,0,.35)}
#tip.tpn[style*="block"]{display:flex!important;gap:12px;align-items:flex-start}
#tip.tpn>*{zoom:1}
#tip.tpn .tpcard{flex:0 0 auto;zoom:1.05}
#tip.tpn .tpi{width:290px;font-size:13px;line-height:1.55}
#tip.tpn.tpe .tpi{width:300px}
#tip.tpn .tps{margin-bottom:7px}#tip.tpn .tps:last-child{margin-bottom:0}
#tip.tpn .tph{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:900;color:#5a3a02;border-bottom:1px dashed #b89a5e;padding-bottom:2px;margin-bottom:3px}
#tip.tpn .tpr{margin-left:auto;font-size:11.5px}
#tip.tpn .tpc{display:inline-block;font-size:11.5px;font-weight:800;border-radius:5px;padding:0 6px;margin:1px 4px 1px 0;border:1px solid rgba(0,0,0,.15)}
#tip.tpn .tpk{color:#7c5a20;font-weight:700}
#tip.tpn .tpx{font-size:12.5px;color:#5b4520}
#tip.tpn .hurt{color:#dc2626}
#tip.tpn .ohtop,#tip.tpn .ohbot{zoom:1}

/* M88 手札オーバー+ディスカードのパネル(赤い柱) */
#discmsg{display:flex;padding:0!important;border:0!important;border-radius:14px;overflow:hidden;background:rgba(15,23,42,.92);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.18);min-width:320px}
#discmsg[hidden]{display:none!important}
#discmsg .pbar{width:60px;flex:0 0 60px;display:grid;place-items:center;background:linear-gradient(180deg,#f87171,#991b1b)}
#discmsg .pin{padding:10px 16px 11px}
#discmsg .dmh{font-size:18px;font-weight:900;color:#fecaca;display:flex;align-items:center;gap:8px}
#discmsg .dmn{font-size:14px;border-radius:6px;padding:0 8px}
#discmsg .dms{font-size:14px;color:#e2e8f0;margin-top:3px;font-weight:700}#discmsg .dms b{font-size:18px;color:#fde68a}

/* M88 通行料のボタン: 払う相手の札を左上の角に重ねる / 領地クリーチャースペルの案内札(ボタンの右) */
html body #dicelayer #actions button.toll:not(.diceobj):not(.fsbtn){overflow:visible;margin-top:12px}
#actions .tolltag{position:absolute;left:-6px;top:-19px;white-space:nowrap;font-size:11.5px;font-weight:800;color:#0f172a;background:#fff;border:1px solid #64748b;border-radius:6px;padding:0 7px;line-height:17px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
#actions .tolltag .short{color:#dc2626}
#actions .lshint{cursor:pointer}#actions .lshint .lhi{background:#7c3aed}#actions .lshint:hover{filter:brightness(1.04)}

/* M88 止まった直後の対決の表示: 侵略側の空き枠 */
#invlayer .invside.invempty .invph{width:156px;height:218px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:3px dashed rgba(255,255,255,.6);border-radius:10px;background:rgba(15,23,42,.35);color:#fff;font-weight:900;font-size:15px;padding:8px;box-sizing:border-box}
#invlayer .invside.invempty .invph small{font-size:11px;font-weight:600;color:#e2e8f0}

/* M88 クリーチャーの移動: 札が放物線で跳ぶ → 着地で土ぼこり */
.crjump .cj{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;white-space:nowrap;transform:translate(-50%,-50%);background:rgba(255,255,255,.97);border:1px solid #94a3b8;border-left:7px solid var(--ow);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:900;color:#0f172a;box-shadow:0 10px 16px rgba(0,0,0,.35);animation:cjump calc(640ms / var(--sp)) cubic-bezier(.35,0,.65,1) both}
.crjump .cj i{width:11px;height:11px;border-radius:50%;display:inline-block}
@keyframes cjump{0%{transform:translate(-50%,-50%) scale(1)}12%{transform:translate(-50%,calc(-50% - 14px)) scale(1.06)}50%{transform:translate(calc(-50% + var(--dx) * .5),calc(-50% + var(--dy) * .5 - 80px)) scale(1.12)}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
.crland i{position:absolute;left:0;top:0;width:14px;height:10px;border-radius:50%;background:rgba(160,130,90,.75);animation:crdust calc(560ms / var(--sp)) ease-out both}
.crland i:nth-child(1){--x:-38px}.crland i:nth-child(2){--x:-18px}.crland i:nth-child(3){--x:0px}.crland i:nth-child(4){--x:18px}.crland i:nth-child(5){--x:38px}
@keyframes crdust{0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}100%{transform:translate(calc(-50% + var(--x)),calc(-50% - 10px)) scale(1.8);opacity:0}}

/* M89 波動・刻印の一覧パネル: 明るいすりガラス(直角)、1件1行 */
#placefx{background:rgba(255,255,255,.55)!important;border:0!important;border-radius:0!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8),0 0 0 1px rgba(15,23,42,.25),0 4px 12px rgba(0,0,0,.15)!important;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 9px!important;max-height:calc(5 * 2.9em + 2.4em)!important;color:#0f172a}
#placefx .pfxh{font-size:12px!important;font-weight:900!important;color:#1e293b!important;border-bottom:1px solid rgba(15,23,42,.2);padding-bottom:2px;margin:2px 0 3px}
#placefx .pfx.pgr{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:start;padding:3px 0;line-height:1.4}
#placefx .pfx.pgr.off{opacity:.5;text-decoration:none}
#placefx .pbd{font-size:11.5px;font-weight:800;border:1px solid currentColor;background:#fff;border-radius:9px;padding:0 6px;white-space:nowrap}
#placefx .pbd.pimk{color:#334155;display:inline-flex;align-items:center;gap:4px}
#placefx .pt{font-size:12.5px;font-weight:800}
#placefx .pown{font-size:11px;font-weight:600;color:#475569;margin-left:5px}
#placefx .ptag{font-size:10.5px;font-weight:700;background:rgba(15,23,42,.1);padding:0 5px;margin-left:5px}
#placefx .pd{font-size:11.5px;color:#334155}
/* M89 小さな情報ウインドウ(刻印・波動)は羊皮紙に戻す(1件1行の構成はそのまま) */
#sptip.glass{background:#fdf6e3!important;color:#3b2a10!important;border:2px solid #8a6a2f!important;border-radius:4px!important;box-shadow:inset 0 0 0 3px #f5e6c4,0 6px 16px rgba(0,0,0,.3)!important;backdrop-filter:none;-webkit-backdrop-filter:none}
#sptip.glass .ghd{color:#5a3a02;border-bottom:1px dashed #b89a5e}#sptip.glass .ghd small{color:#7c5a20}
#sptip.glass .gd{color:#5b4520}#sptip.glass .gtag{background:#efe3c4;color:#5a3a02;border-radius:4px}
#sptip.glass .gsum{border-top:1px dashed #b89a5e}

/* M89 */
.crjump .cj i.elsym{width:15px;height:15px;border-radius:0;background-color:transparent}
#lsw .lsk .elsym{width:14px;height:14px;margin:-2px 3px 0 0}
.card .no{border-radius:0!important;width:18px!important;height:18px!important;line-height:18px!important;font-size:11px!important;top:-9px!important;left:-8px!important}
#actions .lchint{align-self:flex-end!important}
#stock .stkcards{padding-left:6px}

/* M90 手札のカードのスロットから使ったスペル: 手札のそのカードの上でスロットが光る */
.slothand .ssc{position:absolute;left:0;top:0;transform:translate(-50%,-50%);animation:slothandin calc(1500ms / var(--sp)) ease-out both;filter:drop-shadow(0 0 12px rgba(250,204,21,.8))}
.slothand .ssc>.card{width:100%!important;margin:0}
@keyframes slothandin{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}

/* M90 ダイスまわりのボタンを横並び、下端をそろえる。案内札にもボタンと同じ厚みの影(見た目の下端をそろえる) */
#actions .dicegrp{align-items:flex-end!important}
#actions .dicewin{flex-direction:row!important;align-items:flex-end!important;min-width:0!important}
#actions .lchint{box-shadow:inset 0 2px 3px rgba(0,0,0,.2),0 0 0 1px #3d444c,0 3px 0 #3d444c,0 6px 12px rgba(0,0,0,.3)!important}

/* M90 ログのたたむボタンは出さない。閉じるボタンはログ・情報・パネルで同じ形(×) */
#logfold{display:none!important}
#logclose,#assetwin .wclose,#landcmd .lcx,.pkB .pkx.wclose{width:24px;height:22px;min-width:0;padding:0!important;font-size:15px!important;line-height:1;border-radius:5px!important;display:inline-grid;place-items:center}

/* M90 */
body:has(#editor[style*="block"]),body:has(#mapeditor[style*="block"]){overflow:hidden} /* デッキ編集・マップ編集: スクロールバーは編集画面の1つだけ */
.sumfly{z-index:45} /* ディスカードの確認: 促すパネルより前に */
/* 召喚・交換・捨てるの確認: 情報はカードの右に上から下へ */
.sumfly{display:grid!important;grid-template-columns:auto minmax(0,auto);column-gap:12px;align-items:start;width:auto!important}
.sumfly>.card,.sumfly>.sumpair{grid-row:1/3}
.sumfly .sumchips{display:flex!important;flex-direction:column;align-items:flex-start;gap:5px;margin:0!important;max-width:240px}
.sumfly .sumact{grid-column:1/-1}
#placefx,#lsw,#landcmd,:is(#pickdlg,#tpkdlg).pkB,#discmsg,#assetwin{background-clip:padding-box}
.spchip{display:inline-block;background:#0369a1;color:#e0f2fe;border-radius:9px;padding:0 8px;font-weight:800;font-size:.92em;line-height:1.35}.spchip.sm{padding:0 6px;font-size:.85em}

/* M90 領地コマンド: 交換の空白のカード */
#landcmd .lcblanks{display:flex;flex-wrap:wrap;gap:4px}
#landcmd button.lcblank{width:26px;height:36px;min-width:0;padding:0!important;border:3px solid;border-radius:4px!important;background:#fff!important;box-shadow:0 1px 2px rgba(0,0,0,.3)!important;transform:none}
#landcmd button.lcblank:hover:not(.dis){outline:2px solid #facc15;outline-offset:1px}
#landcmd button.lcblank.dis{opacity:.35}
#cards .card.lcxhl{outline:4px solid #facc15;outline-offset:2px;transform:translateY(-8px)}

/* M90 土地レベルアップ: 比較表 */
#bannerlayer .banner.pb.lvtab .bs{text-align:left}
.banner .lvh{font-size:17px;font-weight:900;color:#bfdbfe;display:flex;align-items:center;gap:6px}.banner .lvh .lvlv{color:#fff}
.banner .lvnm{font-size:13px;border-radius:6px;padding:0 8px}
.banner .lvg{display:grid;grid-template-columns:76px auto 24px auto;align-items:center;row-gap:5px;margin-top:8px;font-variant-numeric:tabular-nums}
.banner .lvg .k{font-size:12.5px;color:#cbd5e1;font-weight:700}.banner .lvg .a{font-size:15px;color:#94a3b8;text-align:right}.banner .lvg .ar{color:#fde68a;text-align:center}
.banner .lvg .b{font-size:20px;font-weight:900;color:#fff}.banner .lvg .b i{font-style:normal}.banner .lvg .up{font-size:12px;color:#86efac;margin-left:6px}
.banner .lvc{margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:13px;color:#cbd5e1}.banner .lvc b{font-size:16px;color:#fde68a}

/* M90 開始画面: ゲームモード / 手札開示の見出し */
.gmodes{display:grid;gap:6px;margin-top:10px}.gmodes>div{display:flex;align-items:center;gap:8px}.gmodes span{min-width:11em;font-weight:700}.gmodes select{width:200px;max-width:100%}
#handbox.handopen #cards{pointer-events:none}
#cards .hoplab{align-self:flex-start;writing-mode:vertical-rl;font-weight:900;font-size:13px;padding:8px 4px;border-radius:6px;pointer-events:none}

/* M90 領地クリーチャースペル: 土地の列 */
#lsw{width:310px!important} /* 土地の列を外して狭く */
#lsw .lsrow{grid-template-columns:minmax(0,1fr) 40px minmax(0,1.2fr)!important}
#lsw .lsl{font-size:11.5px;color:var(--mut);white-space:nowrap}

#invlayer .invside.noanim{animation:none!important}

/* M90 金・銀の金属ボタンを、開始画面・リプレイ・結果・確認(召喚・侵略・援護しない)・ショップ・確認ダイアログにも */
html body :is(#overlay .btns,.sumact,#invlayer .invbtnbox,.cfbox .cfb) button:not(.diceobj):not(.fsbtn):not(.deckv){--mf:linear-gradient(180deg,#ffffff,#e6eaf0);--mm:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.06) 1px 3px),linear-gradient(180deg,#ffffff 0%,#dfe4e9 20%,#7d8792 48%,#3d444c 52%,#8b949e 60%,#e6eaee 85%,#59616a 100%);--md:#1f2328;--mk:#3d444c;
  position:relative;border:5px solid transparent!important;border-radius:16px 4px 16px 4px!important;background:var(--mf) padding-box,var(--mm) border-box!important;color:var(--md)!important;font-weight:800!important;text-shadow:none!important;padding:6px 16px!important;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.9),0 0 0 1px var(--mk),0 3px 0 var(--mk),0 6px 12px rgba(0,0,0,.35)!important;transition:transform .08s,box-shadow .08s}
html body :is(#overlay .btns,.sumact,#invlayer .invbtnbox,.cfbox .cfb) button:not(.diceobj):not(.fsbtn):not(.deckv).pri{--mf:linear-gradient(180deg,#fffdf5,#efe7d2);--mm:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,rgba(0,0,0,.07) 1px 3px),linear-gradient(180deg,#fffbe0 0%,#f3cf5e 20%,#a87406 48%,#6b4702 52%,#b98208 60%,#f6d877 85%,#7a5204 100%);--md:#3a2400;--mk:#5a3a02}
html body :is(#overlay .btns,.sumact,#invlayer .invbtnbox,.cfbox .cfb) button:not(.diceobj):not(.fsbtn):not(.deckv):hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
html body :is(#overlay .btns,.sumact,#invlayer .invbtnbox,.cfbox .cfb) button:not(.diceobj):not(.fsbtn):not(.deckv):active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 0 0 1px var(--mk),0 2px 4px rgba(0,0,0,.3)!important}
html body :is(#overlay .btns,.sumact,#invlayer .invbtnbox,.cfbox .cfb) button:not(.diceobj):not(.fsbtn):not(.deckv):disabled{filter:grayscale(.6);opacity:.55}
html body :is(#overlay .btns,.sumact,#invlayer .invbtnbox,.cfbox .cfb) button:not(.diceobj):not(.fsbtn):not(.deckv) kbd{background:var(--md)!important;color:#fff!important;border:0!important;box-shadow:none!important}

/* M90 マリガンのパネル(手札オーバーと同じ作り、青い柱・カードの束が回る) */
.cardflow .mullplate{display:flex;border-radius:14px;overflow:hidden;background:rgba(15,23,42,.92);color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(255,255,255,.18);min-width:320px;animation:pop .3s ease-out}
.cardflow .mullplate .pbar{width:60px;flex:0 0 60px;display:grid;place-items:center;background:linear-gradient(180deg,#60a5fa,#1e40af)}
.cardflow .mullplate .mullico{animation:mullspin calc(1.2s / var(--k)) ease-in-out infinite}
@keyframes mullspin{0%{transform:rotate(0)}50%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.cardflow .mullplate .pin{padding:10px 16px 11px}
.cardflow .mullplate .dmh{font-size:18px;font-weight:900;color:#bfdbfe;display:flex;align-items:center;gap:8px}
.cardflow .mullplate .dmn{font-size:14px;border-radius:6px;padding:0 8px}
.cardflow .mullplate .dms{font-size:14px;color:#e2e8f0;margin-top:3px;font-weight:700}.cardflow .mullplate .dms b{font-size:18px;color:#fde68a}

/* M90 新しいスペル・特性の演出(マス・アバターの上に輪と文字) */
.spfx{--c:#a855f7}.spfx.k-evil{--c:#7e22ce}.spfx.k-cure{--c:#22c55e}.spfx.k-unsummon{--c:#38bdf8}.spfx.k-down{--c:#dc2626}.spfx.k-fragile{--c:#f97316}.spfx.k-hold{--c:#dc2626}.spfx.k-sanctuary{--c:#eab308}.spfx.k-triumph{--c:#f59e0b}
.spfx.k-lostPlan{--c:#64748b}.spfx.k-bind{--c:#7c2d12}.spfx.k-wordzero{--c:#0ea5e9}.spfx.k-cleanse{--c:#fde68a}.spfx.k-snatch{--c:#db2777}.spfx.k-charity{--c:#10b981}
.spfx i{position:absolute;left:0;top:0;width:90px;height:46px;margin:-23px 0 0 -45px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 18px var(--c),inset 0 0 12px var(--c);animation:spring calc(1200ms / var(--sp)) ease-out both}
.spfx i.r2{animation-delay:calc(220ms / var(--sp))}
.spfx.sp i{width:56px;height:56px;margin:-28px 0 0 -28px}
.spfx b{position:absolute;left:0;top:-30px;transform:translateX(-50%);white-space:nowrap;font-size:20px;font-weight:900;color:#fff;-webkit-text-stroke:5px var(--c);paint-order:stroke;animation:spword calc(1500ms / var(--sp)) ease-out both}
.spfx.k-evil b,.spfx.k-down b,.spfx.k-fragile b{font-size:24px}
@keyframes spring{0%{transform:scale(.2);opacity:0}25%{opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes spword{0%{transform:translate(-50%,10px) scale(.6);opacity:0}20%{transform:translate(-50%,0) scale(1.1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-14px);opacity:0}}

/* M90 下揃え: #actions は wrap-reverse(交差軸が上下逆)なので、flex-start が下端 */
#dicelayer #actions{align-items:flex-start!important}
#dicelayer #actions>*{align-self:flex-start!important}
/* ---- M91: デッキ編集(文字1.2倍・カードの大きさをそろえる・枚数の帯を上に固定・右側は1枚1行) */
#editor{padding-top:0}#editor .ed{zoom:1.2;max-width:1200px}
#editor .edsum{position:sticky;top:0;z-index:6;box-shadow:0 2px 6px rgba(0,0,0,.12)}
#editor .ed>.edhead{padding-top:10px}
/* M95: カード一覧は以前の並べ方(幅150pxで左から詰めて折り返す) */
.deck .drow2{color:#fff;box-sizing:border-box;font-weight:800;font-size:13px;padding:3px 8px;margin:0 0 2px;border-radius:4px;text-shadow:0 1px 2px rgba(0,0,0,.65),0 0 2px rgba(0,0,0,.5);cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .drow2:hover{outline:2px solid var(--fg)}
.edtip{position:fixed;z-index:60;width:200px;pointer-events:none;display:block!important;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}.edtip .card{width:200px}
/* 橋: 対の橋へ「ぼよーん」と弧を描いて跳ぶ */
.avslide.avbridge{animation-name:avbridge;animation-timing-function:ease-in-out}
@keyframes avbridge{0%{transform:translate(var(--dx),var(--dy)) scale(1,1)}8%{transform:translate(var(--dx),calc(var(--dy) + 4px)) scale(1.15,.8)}50%{transform:translate(calc(var(--dx) * .5),calc(var(--dy) * .5 - 90px)) scale(.92,1.1)}92%{transform:translate(0,3px) scale(1.15,.82)}100%{transform:translate(0,0) scale(1,1)}}
/* 聖堂のトレード画面(仮) */
#cathdlg{display:none;position:absolute;left:calc(var(--mx,0px) + var(--mw,100%) / 2);top:calc(var(--my,0px) + var(--mh,100%) / 2);transform:translate(-50%,-50%);z-index:9;border:5px solid #b45309;border-radius:14px;padding:44px 16px 12px;background:rgba(40,28,10,.92);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:visible}
.cathwin{position:absolute;left:calc(var(--mx,0px) + var(--mw,100%) / 2);top:calc(var(--my,0px) + var(--mh,100%) / 2);transform:translate(-50%,-50%);z-index:9;border:5px solid #b45309;border-radius:14px;padding:44px 16px 12px;background:rgba(40,28,10,.92);color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none}
:is(#cathdlg,.cathwin) .shrmodel{position:absolute;left:50%;top:0;width:130px;height:161px;transform:translate(-50%,-80%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));pointer-events:none}
:is(#cathdlg,.cathwin) .shh{font-weight:900;font-size:18px;color:#fde68a;text-align:center;margin-bottom:2px}
:is(#cathdlg,.cathwin) .cathsub{text-align:center;font-size:12px;color:#fef3c7;margin-bottom:8px}
:is(#cathdlg,.cathwin) .shrow{display:flex;gap:12px}:is(#cathdlg,.cathwin) .shit{display:flex;flex-direction:column;align-items:center;gap:6px}
:is(#cathdlg,.cathwin) .cathslot{width:120px;height:160px;border:2px dashed #fcd34d;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fcd34d;background:rgba(255,255,255,.06)}
:is(#cathdlg,.cathwin) .shcost{font-weight:800;color:#fde68a}
:is(#cathdlg,.cathwin) .shfoot{display:flex;justify-content:center;gap:10px;margin-top:10px}
:is(#cathdlg,.cathwin) button{border-radius:10px;padding:6px 14px;font-weight:800;border:1px solid #78350f;background:linear-gradient(180deg,#fef3c7,#fcd34d);color:#78350f;cursor:pointer}:is(#cathdlg,.cathwin) button:disabled{opacity:.45;cursor:not-allowed}
#handbox{z-index:7} /* 手札・ストックは盤面効果情報(波動・刻印)より手前(同じ層で後ろに書かれている) */
/* M91: セプターパネル。左端(自分)は幅0.8倍、ほかは1.1倍。「総魔力」「所持」「手札」「残」「周」は「G」と同じ大きさ */
.ppan .plb{font-size:.82em;margin-right:.22em}.ppan .prr .gu{margin-left:.12em}
.ppan.self{min-width:194px!important;width:194px;box-sizing:border-box}.ppan.self .pr2{white-space:nowrap;letter-spacing:-.02em}.ppan:not(.self){min-width:117px!important}
#board .optx{fill:transparent;cursor:not-allowed} /* 移動・移動侵略できない隣のマス(クリックで理由) */
/* マップの演出はマップの描画エリアで切り取る(パネルは対象外) */
#mapclip{position:fixed;inset:0;z-index:58;pointer-events:none;transform:translateZ(0)}
#boardwrap{overflow:clip}
#mapeditor .mwarp.mbridge{stroke:#475569} /* 橋の対の線 */
#editor .edcols>section:last-child .edtools{flex-wrap:wrap} /* 右の列は狭いので道具は折り返す */
/* 最終ラウンド: 金と赤の派手なバナー・光の脈動・画面の閃光 / ラウンド終了 */
#bannerlayer .banner.rleft.final{border:6px solid #fbbf24!important;background:linear-gradient(135deg,rgba(127,29,29,.95),rgba(69,10,10,.95) 50%,rgba(120,53,15,.95))!important;box-shadow:0 0 0 3px #7f1d1d,0 0 40px 10px rgba(251,191,36,.65);animation:finalpulse .9s ease-in-out infinite alternate}
#bannerlayer .banner.rleft.final .bb{font-size:clamp(40px,8vw,72px)!important;color:#fde68a!important;text-shadow:0 0 18px rgba(251,191,36,.9),0 3px 0 #7f1d1d;letter-spacing:.08em}
@keyframes finalpulse{from{box-shadow:0 0 0 3px #7f1d1d,0 0 24px 4px rgba(251,191,36,.45)}to{box-shadow:0 0 0 3px #7f1d1d,0 0 60px 18px rgba(251,191,36,.85)}}
.scrflash.finalflash{background:radial-gradient(circle,rgba(253,230,138,.85),rgba(239,68,68,.35) 60%,transparent);animation-duration:.9s}
#bannerlayer .banner.rleft.roundend{border-color:#94a3b8!important}#bannerlayer .banner.rleft.roundend .bb{color:#e2e8f0!important}
.hosym{display:inline-block;vertical-align:-.15em;margin-right:1px;line-height:0}.hosym svg{width:1.05em;height:1.05em}
.sfx.fstxt.late b{color:#cbd5e1!important;text-shadow:0 2px 0 #334155,0 0 10px rgba(15,23,42,.6)!important}
:is(#cards,#stock,.pool,.drawcards,#invlayer,#tip,#shopdlg,.sumfly,.plcard,.spcard,.sfx,.drawfly,.cfly,.cardflow,.discash,.edtip) .card[data-el='spell']{--fr:linear-gradient(160deg,#ede9fe 0%,#a78bfa 24%,#7c3aed 50%,#4c1d95 76%,#1e1b4b 100%);--pat:radial-gradient(circle,rgba(255,255,255,.95) 0 1.4px,transparent 2.2px);--patsz:14px 14px;--tint:radial-gradient(110% 55% at 50% 112%,rgba(167,139,250,.16),transparent 70%);--glow:rgba(167,139,250,.55)}
:is(#cards,.drawcards,#invlayer,.pool) .card[data-el='spell']:hover{animation:pat-spell 2.4s linear infinite,cardglow 3.2s ease-in-out infinite}
@keyframes pat-spell{from{background-position:0 0,0 0,0 0,0 0}to{background-position:0 0,0 0,14px -28px,0 0}}
.card.spellcard .skind b{background:linear-gradient(135deg,#f8fafc,#cbd5e1)!important}.card.spellcard .skind b svg{display:block}
.imptip{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
/* トライアンフの紙吹雪 */
.triconf{position:fixed;left:var(--mapl,0);top:0;inset:0;pointer-events:none;z-index:3}
.triconf i{position:absolute;top:-20px;width:8px;height:13px;background:var(--c);border-radius:2px;animation:triconf calc(var(--t) / var(--sp,1)) cubic-bezier(.25,.6,.4,1) calc(var(--d) / var(--sp,1)) both}
@keyframes triconf{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.triconf .trititle{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font:900 clamp(40px,7vw,80px)/1 system-ui;color:#fde68a;-webkit-text-stroke:3px #b45309;paint-order:stroke;text-shadow:0 0 24px rgba(251,191,36,.9);text-align:center;animation:tripop calc(700ms / var(--sp,1)) cubic-bezier(.2,1.6,.4,1) both}
.triconf .trititle small{display:block;font-size:.3em;-webkit-text-stroke:0;color:#fff;text-shadow:0 2px 4px #000;margin-top:8px}
@keyframes tripop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.lr.tri span{color:#d97706;font-weight:800}
.spcard.retglow{filter:drop-shadow(0 0 10px #a78bfa) drop-shadow(0 0 22px #c4b5fd)}
.sfx.retspark i{left:0;top:0;width:6px;height:6px;border-radius:50%;background:#ddd6fe;box-shadow:0 0 8px #a78bfa;animation:retsp calc(800ms / var(--sp,1)) ease-out calc(var(--d) / var(--sp,1)) both}
@keyframes retsp{from{transform:rotate(var(--a)) translate(10px);opacity:1}to{transform:rotate(var(--a)) translate(70px);opacity:0}}
/* 即死・自壊: ドクロ → 溶ける */
#invlayer .invside.skulldie>.card{animation:dslvcard var(--dms,1600ms) ease-in both}
@keyframes dslvcard{0%,40%{filter:none;opacity:1;transform:none}55%{filter:brightness(.6) saturate(.3) hue-rotate(-30deg)}100%{filter:blur(6px) brightness(.2) saturate(0);opacity:0;transform:translateY(18px) scaleY(.85)}}
#invlayer .skullmk{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%) scale(.2);opacity:0;z-index:3;filter:drop-shadow(0 0 12px #a855f7) drop-shadow(0 0 26px #7e22ce);animation:skullin var(--dms,1600ms) ease-out both;pointer-events:none}
@keyframes skullin{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.35) rotate(4deg)}30%,55%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1.6)}}
#invlayer .dslv{position:absolute;width:6px;height:6px;border-radius:50%;background:#581c87;box-shadow:0 0 6px #a855f7;opacity:0;animation:dslvp var(--d) ease-out calc(var(--dms,1600ms) * .45) both;pointer-events:none}
@keyframes dslvp{from{opacity:.9;transform:none}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
/* 強打で倒れる: 衝撃で揺れて奥へ倒れる */
#invlayer .invside.smashdie{perspective:700px}
#invlayer .invside.smashdie>.card{transform-origin:50% 100%;animation:smashcard var(--dms,1200ms) ease-in both}
@keyframes smashcard{0%{transform:none}6%{transform:translate(-7px,3px) scale(.97)}12%{transform:translate(6px,-2px)}18%{transform:translate(-5px,2px)}24%{transform:translate(3px,0)}35%{transform:none;opacity:1}100%{transform:rotateX(82deg) translateY(10px);opacity:0;filter:brightness(.4)}}
#invlayer .smashwave{position:absolute;left:50%;top:45%;width:0;height:0;z-index:3;pointer-events:none}
#invlayer .smashwave i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:6px solid rgba(255,255,255,.95);box-shadow:0 0 18px #fbbf24;animation:smashring calc(var(--dms,1200ms) * .45) ease-out both}
#invlayer .smashwave i.w2{border-color:rgba(251,191,36,.9);animation-delay:calc(var(--dms,1200ms) * .08)}
#invlayer .smashwave b{position:absolute;left:-2px;top:-30px;width:4px;height:26px;background:linear-gradient(#fff,#fbbf24);transform-origin:2px 30px;transform:rotate(var(--a)) translateY(-20px);opacity:0;animation:smashray calc(var(--dms,1200ms) * .35) ease-out both}
@keyframes smashring{from{transform:scale(.1);opacity:1}to{transform:scale(1.4);opacity:0}}
@keyframes smashray{0%{opacity:1;transform:rotate(var(--a)) translateY(-10px) scaleY(.4)}100%{opacity:0;transform:rotate(var(--a)) translateY(-46px) scaleY(1)}}
/* ダメージ0: バリア(六角の光の膜) / 鏡(銀の面と光の筋) */
.sfx.zfx i{position:absolute;left:calc(var(--w) / -2 - 10px);top:calc(var(--h) / -2 - 10px);width:calc(var(--w) + 20px);height:calc(var(--h) + 20px)}
.sfx.zfx.k-shield .hx{border-radius:18px;background:repeating-conic-gradient(from 30deg,rgba(125,211,252,.28) 0 60deg,rgba(186,230,253,.12) 60deg 120deg);border:3px solid rgba(56,189,248,.95);box-shadow:0 0 22px #38bdf8,inset 0 0 30px rgba(14,165,233,.5);animation:zshield calc(1000ms / var(--sp,1)) ease-out both}
.sfx.zfx.k-shield .hx.h2{animation-delay:calc(120ms / var(--sp,1));border-color:rgba(255,255,255,.9);background:none}
@keyframes zshield{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.05)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}

/* M95: 金属フレームのボタン(どこでも使える版)。.mtl=銀、.mtl.gold=金。.mtl.ico=ヘッダの小さなアイコンボタン */
html body button.mtl:not(#_m):not(#_n):not(#_p){--mf:linear-gradient(180deg,#ffffff,#e6eaf0);--mm:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.06) 1px 3px),linear-gradient(180deg,#ffffff 0%,#dfe4e9 20%,#7d8792 48%,#3d444c 52%,#8b949e 60%,#e6eaee 85%,#59616a 100%);--md:#1f2328;--mk:#3d444c;
  position:relative;border:4px solid transparent;border-radius:14px 4px 14px 4px;background:var(--mf) padding-box,var(--mm) border-box;color:var(--md);font-weight:800;text-shadow:none;padding:5px 14px;cursor:pointer;
  box-shadow:inset 0 2px 3px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.9),0 0 0 1px var(--mk),0 3px 0 var(--mk),0 5px 10px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
html body button.mtl:not(#_m):not(#_n):not(#_p).gold{--mf:linear-gradient(180deg,#fffdf5,#efe7d2);--mm:repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,rgba(0,0,0,.07) 1px 3px),linear-gradient(180deg,#fffbe0 0%,#f3cf5e 20%,#a87406 48%,#6b4702 52%,#b98208 60%,#f6d877 85%,#7a5204 100%);--md:#3a2400;--mk:#5a3a02;padding-left:18px;padding-right:18px}
html body button.mtl:not(#_m):not(#_n):not(#_p).gold:not(.ico)::before,html body button.mtl:not(#_m):not(#_n):not(#_p).gold:not(.ico)::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e0b040 45%,#4a3000)}
html body button.mtl:not(#_m):not(#_n):not(#_p).gold:not(.ico)::before{left:-6px}html body button.mtl:not(#_m):not(#_n):not(#_p).gold:not(.ico)::after{right:-6px}
html body button.mtl:not(#_m):not(#_n):not(#_p):hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.05)}
html body button.mtl:not(#_m):not(#_n):not(#_p):active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 3px 5px rgba(0,0,0,.35),0 0 0 1px var(--mk),0 0 0 var(--mk),0 2px 4px rgba(0,0,0,.3)}
